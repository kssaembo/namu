name: Build Windows EXE

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller requests beautifulsoup4

      - name: Validate Python syntax
        shell: pwsh
        run: |
          python -m py_compile NamuRulesCollector.py

      - name: Build standalone Windows EXE
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name NamuRulesCollector NamuRulesCollector.py

      - name: Verify EXE exists
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\NamuRulesCollector.exe")) {
            throw "dist\NamuRulesCollector.exe was not created."
          }
          Get-Item "dist\NamuRulesCollector.exe"

      - name: Upload Windows EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: NamuRulesCollector-windows
          path: dist/NamuRulesCollector.exe
          if-no-files-found: error
          retention-days: 30
